r-radius:30px;padding:7px 11px;font-size:12px;font-weight:750}.card{background:#253246;border:1px solid #34465d;border-radius:19px;padding:16px;margin:10px 0}.jobtop{display:flex;align-items:center;gap:12px}.jobicon{display:grid;place-items:center;background:#37465b;border-radius:13px;width:48px;height:48px;font-size:24px;flex:none}.grow{flex:1;min-width:0}.jobname{font-size:16px;font-weight:750;overflow-wrap:anywhere}.meta{color:#aebccd;font-size:12px;margin-top:4px}.price{font-weight:850;font-size:20px;color:#c5f17b;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1;min-width:120px}.btn{background:#34465c;border:1px solid #50647c;color:#f3f6fa;padding:11px 13px;border-radius:12px;font-weight:650}.btn.primary{background:#c5f17b;border-color:#c5f17b;color:#172418;font-weight:850}.btn.danger{background:transparent;border-color:#a97d7d;color:#ffcbcb}.pill{display:inline-block;border-radius:20px;background:#36475b;color:#dce7f1;font-size:12px;padding:6px 10px}.pill.warn{color:#ffe2a0}.pill.ok{color:#c5f17b}.status{margin-top:12px}.empty{padding:27px 15px;text-align:center;border:1px dashed #43546b;border-radius:16px;color:#aebccd}.form label{display:block;color:#c8d5e2;font-size:13px;margin:14px 0 6px}.form input,.form select,.form textarea{display:block;width:100%;background:#131e2e;border:1px solid #53647a;color:white;border-radius:12px;padding:12px}.form textarea{min-height:85px}.form button[type=submit]{margin-top:15px}.detail{margin-top:15px}.detail summary{cursor:pointer;color:#c5f17b;font-size:13px}.historyrow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #425169;padding:12px 0}.notice{margin:32px 0;color:#9babbf;font-size:12px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#c5f17b;color:#142017;border-radius:14px;padding:12px 17px;font-weight:750;z-index:10;max-width:90%;box-shadow:0 8px 30px #0008}.bottom{position:fixed;bottom:0;left:0;right:0;background:#131d2bf2;backdrop-filter:blur(12px);border-top:1px solid #33445a;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:4px;z-index:5}.bottom button{border:0;background:transparent;color:#b6c3d2;padding:9px 5px;font-size:11px;min-width:0;flex:1}.bottom button.on{color:#c5f17b;font-weight:800}.alertdot{display:inline-block;width:9px;height:9px;background:#ff5269;border-radius:50%;margin-left:5px;vertical-align:middle;box-shadow:0 0 0 2px #131d2b}.bottom .symbol{display:block;font-size:21px;margin-bottom:3px}.footerline{height:1px;background:#33445a;margin:18px 0}.topaction{font-size:12px}.hidden{display:none!important}@media(min-width:740px){main{padding-bottom:40px}.bottom{position:static;max-width:700px;margin:0 auto;border:1px solid #33445a;border-radius:16px}.toast{bottom:20px}}@media(max-width:350px){.brand{font-size:13px}.card{padding:12px}.price{font-size:17px}}

#login{max-width:430px;margin:35px auto}.loginfield{width:100%;padding:12px;background:#131e2e;border:1px solid #53647a;border-radius:12px;color:#fff;margin:6px 0 13px}.error{color:#ffb4b4}.statusline{min-height:25px;color:#c5f17b}.topright{display:flex;align-items:center;gap:8px}.topright button{font-size:12px}.notice{margin-top:20px}#busy{color:#c5f17b;font-size:13px}.bottom button{font-size:12px} .form .actions button{flex:1}</style></head><body><main><header><div class="brand"><span class="logo">⚡</span>HJEMME<span>JOBBEN</span></div><div class="topright"><span class="pill">V6 · PILOT</span><button id="logout" class="btn hidden">Logg ut</button></div></header>
<section id="login" class="card hidden"><h2>Velkommen hjem 👋</h2><p class="subtitle">Logg inn med familiekontoen din.</p><form id="loginForm"><label>E-post</label><input class="loginfield" id="email" type="email" autocomplete="username" required><label>Passord</label><input class="loginfield" id="password" type="password" autocomplete="current-password" required><button class="btn primary" type="submit" id="loginBtn">Logg inn</button></form></section>
<section id="app" class="hidden"><div class="eyebrow" id="eyebrow"></div><h1 id="greeting"></h1><p class="subtitle" id="subtitle"></p><div class="stats" id="stats"></div><section id="content" aria-live="polite"></section><p class="notice">Familiepilot · Oppgaver og penger synkroniseres med Supabase. Utbetalinger her registrerer bare hva dere allerede har betalt; ingen penger overføres automatisk.</p><nav class="bottom" id="tabs" aria-label="Hovedmeny"></nav></section>
<p id="busy" role="status"></p><p id="message" class="statusline" role="status"></p></main><div id="toast" class="toast hidden" role="status"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://ogvtognduhqrjoenekmh.supabase.co','sb_publishable_IbGuNefrsEEvuvvgK3sCjQ_s50CdAeD',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n||0)/100).toLocaleString('nb-NO',{style:'currency',currency:'NOK'});
const icons={'Tømme søppel':'🗑️','Tømme oppvaskmaskinen':'🍽️','Støvsuge stua':'🧹','Vaske badet':'🧽','Brette klær':'👕'};
const statusNames={reserved:'Reservert',submitted:'Venter på godkjenning',rejected:'Må gjøres på nytt',approved:'Godkjent',released:'Frigitt'};
let profile=null,chores=[],history=[],balances=[],payments=[],tab='board',editId=null,loading=false;
const isParent=()=>profile?.role==='parent';
function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3200)}
function setMessage(s,bad=false){$('message').textContent=s;$('message').className=bad?'statusline error':'statusline'}
function btn(label,action,cls=''){return `<button type="button" class="btn ${cls}" data-act="${esc(action)}">${esc(label)}</button>`}
function currentPeriod(f){const now=new Date(),fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Oslo',year:'numeric',month:'2-digit',day:'2-digit'}),d=fmt.format(now);if(f==='daily')return d;if(f==='once')return 'once';const date=new Date(d+'T12:00:00Z');const day=(date.getUTCDay()+6)%7;date.setUTCDate(date.getUTCDate()-day+3);const yr=date.getUTCFullYear();const first=new Date(Date.UTC(yr,0,4));const firstDay=(first.getUTCDay()+6)%7;first.setUTCDate(first.getUTCDate()-firstDay+3);return yr+'-W'+String(1+Math.round((date-first)/604800000)).padStart(2,'0')}
function assignmentId(r){return r.assignment_id||r.chore_assignment_id||r.id}
function currentAssignment(j){const p=currentPeriod(j.frequency);return history.find(r=>String(r.chore_id||'')===String(j.id)&&r.period_key===p&&['reserved','submitted','rejected','approved'].includes(r.status))||history.find(r=>r.chore_title===j.title&&r.period_key===p&&['reserved','submitted','rejected','approved'].includes(r.status))}
function card(j){const r=currentAssignment(j),mine=r?.child_alias===profile.alias;let actions='';if(isParent())actions=`<span class="pill">${r?esc(statusNames[r.status]||r.status)+' · '+esc(r.child_alias):'Ledig'}</span>`;else if(!r)actions=btn('Ta oppdrag','reserve:'+j.id,'primary');else if(mine&&r.status==='reserved')actions=btn('Marker fullført','submit:'+assignmentId(r),'primary')+btn('Gi fra meg','release:'+assignmentId(r));else if(mine&&r.status==='rejected')actions=btn('Send inn på nytt','submit:'+assignmentId(r),'primary');else actions=`<span class="pill ${r.status==='rejected'?'warn':''}">${mine?'Din oppgave · ':''}${esc(statusNames[r.status]||r.status)}${!mine?' · '+esc(r.child_alias):''}</span>`;return `<article class="card"><div class="jobtop"><div class="jobicon">${esc(icons[j.title]||'⚡')}</div><div class="grow"><div class="jobname">${esc(j.title)}</div><div class="meta">${j.frequency==='daily'?'Daglig':j.frequency==='weekly'?'Ukentlig':'Én gang'}${j.description?' · '+esc(j.description):''}</div></div><div class="price">${money(j.reward_ore)}</div></div><div class="actions">${actions}</div></article>`}
function historyCard(r,review=false){let actions='';const id=assignmentId(r);if(review&&r.status==='submitted')actions=btn('Godkjenn','approve:'+id,'primary')+btn('Avvis','reject:'+id,'danger');else if(!isParent()&&r.status==='reserved')actions=btn('Marker fullført','submit:'+id,'primary')+btn('Gi fra meg','release:'+id);else if(!isParent()&&r.status==='rejected')actions=btn('Send inn på nytt','submit:'+id,'primary');return `<article class="card"><div class="row"><div><div class="jobname">${esc(r.chore_title||'Oppgave')}</div><div class="meta">${esc(r.child_alias||'')} · ${esc(statusNames[r.status]||r.status)}</div></div><span class="price">${money(r.reward_ore)}</span></div>${r.review_comment?`<p class="muted">${esc(r.review_comment)}</p>`:''}<div class="actions">${actions}</div></article>`}
function render(){if(!profile)return;const par=isParent();$('eyebrow').textContent=par?'FORELDREOVERSIKT':'DINE MULIGHETER';$('greeting').textContent=par?'Kontrollsenter':`Hei, ${profile.alias} 👋`;$('subtitle').textContent=par?'Hold oversikt over oppdrag, godkjenninger og betalinger.':'Finn din neste jobb. Gjør den. Få betalt.';
const own=balances.find(x=>x.child_alias===profile.alias),due=balances.reduce((n,b)=>n+Number(b.balance_ore||0),0),pending=history.filter(r=>r.status==='submitted');$('stats').innerHTML=par?`<div class="stat"><small>Venter på godkjenning</small><strong class="lime">${pending.length}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${money(due)}</strong></div>`:`<div class="stat"><small>Opptjent totalt</small><strong class="lime">${money(own?.earned_ore)}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${money(own?.balance_ore)}</strong></div>`;
const tabs=par?[['board','Oppdrag','▦'],['review','Godkjenn','✓'],['manage','Administrer','⚙'],['money','Økonomi','◉'],['history','Historikk','☷']]:[['board','Oppdrag','▦'],['review','Mine jobber','✓'],['money','Penger','◉'],['history','Historikk','☷']];$('tabs').innerHTML=tabs.map(([id,label,icon])=>`<button data-act="tab:${id}" class="${tab===id?'on':''}"><span class="symbol">${icon}</span>${label}${id==='review'&&par&&pending.length?'<span class="alertdot"></span>':''}</button>`).join('');let h='';
if(tab==='board'){const active=chores.filter(j=>j.active);const available=active.filter(j=>!currentAssignment(j));h=`<div class="sectionhead"><h2>${par?'Denne ukens oppdrag':'Ledige oppdrag'}</h2><span class="count">${available.length} ledige</span></div>`;if(par){for(const [name,frequency] of [['Daglige oppgaver','daily'],['Ukentlige oppgaver','weekly'],['Engangsoppgaver','once']]){const group=active.filter(j=>j.frequency===frequency);h+=`<div class="sectionhead"><h3>${name}</h3></div>`+(group.map(card).join('')||'<div class="empty">Ingen oppgaver.</div>')}}else{h+=available.map(card).join('')||'<div class="empty">Ingen ledige oppdrag akkurat nå.</div>';const mine=active.filter(j=>currentAssignment(j)?.child_alias===profile.alias&&['reserved','rejected','submitted'].includes(currentAssignment(j).status));h+='<div class="sectionhead"><h2>Mine aktive oppdrag</h2></div>'+(mine.map(card).join('')||'<div class="empty">Ingen aktive oppdrag.</div>')}}
if(tab==='review'){const rows=history.filter(r=>par?r.status==='submitted':r.child_alias===profile.alias&&['reserved','submitted','rejected','approved'].includes(r.status));h=`<div class="sectionhead"><h2>${par?'Til godkjenning':'Mine jobber'}</h2><span class="count">${rows.length}</span></div>`+(rows.map(r=>historyCard(r,par)).join('')||'<div class="empty">Ingen oppgaver her akkurat nå.</div>')}
if(tab==='manage'&&par){h=`<div class="sectionhead"><h2>Alle oppgaver</h2>${btn('+ Ny oppgave','new','primary')}</div>`+chores.map(j=>`<article class="card"><div class="row"><div class="grow"><div class="jobname">${esc(j.title)}</div><div class="meta">${money(j.reward_ore)} · ${j.frequency==='daily'?'Daglig':j.frequency==='weekly'?'Ukentlig':'Én gang'} · ${j.active?'Aktiv':'Pauset'}</div></div></div><div class="actions">${btn('Rediger','edit:'+j.id)}${btn(j.active?'Pause':'Aktiver','toggle:'+j.id)}</div></article>`).join('')}
if(tab==='editor'&&par){const j=chores.find(x=>x.id===editId);h=`<div class="sectionhead"><h2>${j?'Rediger oppgave':'Ny oppgave'}</h2></div><form class="card form" id="jobform"><label>Oppgave</label><input name="title" maxlength="80" required value="${esc(j?.title||'')}"><label>Beskrivelse (valgfritt)</label><textarea name="description">${esc(j?.description||'')}</textarea><label>Betaling i kroner</label><input name="price" type="number" min="0" max="10000" step="0.01" required value="${j?Number(j.reward_ore)/100:25}"><label>Hyppighet</label><select name="frequency">${[['daily','Daglig'],['weekly','Ukentlig'],['once','Én gang']].map(([v,t])=>`<option value="${v}" ${j?.frequency===v?'selected':''}>${t}</option>`).join('')}</select><div class="actions"><button class="btn primary" type="submit">Lagre oppgave</button>${btn('Avbryt','tab:manage')}</div></form>`}
if(tab==='money'){h='<div class="sectionhead"><h2>Lønn og utbetaling</h2></div>'+balances.map(b=>`<div class="card"><div class="row"><h3>${esc(b.child_alias)}</h3><span class="pill ${b.balance_ore>0?'warn':'ok'}">${b.balance_ore>0?'Utestående':'Alt betalt'}</span></div><div class="stats"><div class="stat"><small>Opptjent totalt</small><strong>${money(b.earned_ore)}</strong></div><div class="stat"><small>Utbetalt totalt</small><strong>${money(b.paid_ore)}</strong></div></div><div class="row"><span>Til gode</span><strong class="price">${money(b.balance_ore)}</strong></div>${par&&b.balance_ore>0?`<div class="actions">${btn('Registrer betaling','pay:'+b.member_id,'primary')}</div>`:''}<details class="detail"><summary>Betalingshistorikk</summary>${payments.filter(p=>p.child_alias===b.child_alias).map(p=>`<div class="historyrow"><small>${esc(p.paid_at?new Date(p.paid_at).toLocaleDateString('nb-NO'):'Registrert')}${p.reversed_at?' · Annullert':''}</small><strong>${money(p.amount_ore)}</strong></div>`).join('')||'<p class="muted">Ingen betalinger ennå.</p>'}</details></div>`).join('')}
if(tab==='history'){h='<div class="sectionhead"><h2>Aktivitetslogg</h2></div>'+(history.map(r=>historyCard(r,false)).join('')||'<div class="empty">Ingen aktivitet ennå.</div>')}
$('content').innerHTML=h;const form=$('jobform');if(form)form.onsubmit=saveChore;}
async function query(){const [c,h,b,p]=await Promise.all([supabase.from('chores').select('id,title,description,reward_ore,frequency,active,created_at').order('created_at',{ascending:true}),supabase.rpc('get_assignment_history'),supabase.rpc('get_child_balances'),supabase.rpc('get_payment_history')]);for(const x of [c,h,b,p])if(x.error)throw x.error;chores=c.data||[];history=h.data||[];balances=b.data||[];payments=p.data||[];render()}
async function load(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user){profile=null;$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}const {data,error:pe}=await supabase.from('family_members').select('alias,role,family_id').eq('auth_user_id',user.id).single();if(pe)throw pe;profile=data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await query()}
async function run(action){if(loading)return;loading=true;$('busy').textContent='Lagrer…';setMessage('');try{await action();await query()}catch(e){setMessage('Kunne ikke utføre handlingen: '+e.message,true)}finally{loading=false;$('busy').textContent=''}}
async function call(name,args){const {error}=await supabase.rpc(name,args);if(error)throw error}
async function saveChore(e){e.preventDefault();if(!isParent())return;const f=new FormData(e.target),title=String(f.get('title')||'').trim(),price=Number(f.get('price'));if(!title||!Number.isFinite(price)||price<0||price>10000){setMessage('Sjekk navn og beløp.',true);return}const row={title,description:String(f.get('description')||'').trim(),reward_ore:Math.round(price*100),frequency:f.get('frequency')};await run(async()=>{const response=editId?await supabase.from('chores').update(row).eq('id',editId):await supabase.from('chores').insert({...row,family_id:profile.family_id,active:true});if(response.error)throw response.error;tab='manage';toast('Oppgaven er lagret')})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||loading)return;const a=b.dataset.act,[op,...rest]=a.split(':'),id=rest.join(':');if(op==='tab'){tab=id;render();return}if(op==='new'){editId=null;tab='editor';render();return}if(op==='edit'){editId=id;tab='editor';render();return}if(op==='reserve')return run(async()=>{await call('reserve_chore',{p_chore_id:id});toast('Oppdraget er ditt!')});if(op==='submit')return run(async()=>{await call('submit_chore',{p_assignment_id:id});toast('Sendt til godkjenning')});if(op==='release'){if(!confirm('Vil du gi fra deg oppgaven?'))return;return run(async()=>{await call('release_chore',{p_assignment_id:id});toast('Oppgaven er frigitt')})}if(op==='approve'||op==='reject'){let reason=null;if(op==='reject'){reason=prompt('Hvorfor avvises oppgaven? Barnet får se begrunnelsen.');if(reason===null)return;reason=reason.trim()||'Oppgaven må gjøres på nytt.'}return run(async()=>{await call('review_chore',{p_assignment_id:id,p_approve:op==='approve',p_comment:reason});toast(op==='approve'?'Oppgave godkjent':'Tilbakemelding sendt')})}if(op==='toggle'){const j=chores.find(x=>x.id===id);if(!j)return;return run(async()=>{const {error}=await supabase.from('chores').update({active:!j.active}).eq('id',id);if(error)throw error;toast('Oppgaven er oppdatert')})}if(op==='pay'){const child=balances.find(x=>x.member_id===id);if(!child)return;const input=prompt(`Hvor mye har dere betalt til ${child.child_alias}? (maks ${money(child.balance_ore)})`,String(Number(child.balance_ore)/100));if(input===null)return;const amount=Number(input.replace(',','.'));const ore=Math.round(amount*100);if(!Number.isFinite(amount)||ore<=0||ore>Number(child.balance_ore)||Math.abs(amount*100-ore)>.001){setMessage('Ugyldig beløp.',true);return}if(!confirm(`Registrere ${money(ore)} som allerede utbetalt til ${child.child_alias}? Ingen penger overføres.`))return;return run(async()=>{await call('register_payment',{p_member_id:id,p_amount_ore:ore,p_note:'Registrert i Hjemmejobben 6.0'});toast('Utbetaling registrert')})}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;setMessage('Logger inn…');try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await load();setMessage('')}catch(err){setMessage('Innlogging mislyktes: '+err.message,true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await supabase.auth.signOut();tab='board';profile=null;await load();setMessage('Du er logget ut.')};
load().catch(e=>setMessage('Kunne ikke laste appen: '+e.message,true));
</script></body></html>
